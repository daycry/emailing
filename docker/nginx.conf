server {
    listen 80;
    server_name _;
    root /var/www/emailing/public;
    index index.php;
    charset utf-8;
    client_max_body_size 8m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/emailing-fpm/php.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/emailing/public/index.php;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}

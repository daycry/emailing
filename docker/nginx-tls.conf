# Canonical laboratory origin: https://localhost:18443 only.
# Supply certificates privately; see docs/aplicacion/mcp-operacion.md.
server {
    listen 80;
    server_name _;
    root /var/www/emailing/public;
    access_log off;
    error_log /dev/stderr crit;
    charset utf-8;
    client_max_body_size 8m;

    location = /up { try_files $uri /index.php?$query_string; }
    location = /internal/cronicle/trigger { try_files $uri /index.php?$query_string; }
    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_pass unix:/run/emailing-fpm/php.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/emailing/public/index.php;
        fastcgi_hide_header X-Powered-By;
    }
    location / { return 404; }
}

# SNI selection occurs before HTTP routing. Do not serve another name's TLS.
server {
    listen 443 ssl default_server;
    server_name "";
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    return 421;
}

server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /run/secrets/emailing_tls_certificate;
    ssl_certificate_key /run/secrets/emailing_tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake off;
    root /var/www/emailing/public;
    index index.php;
    access_log off;
    error_log /dev/stderr crit;
    charset utf-8;
    client_max_body_size 8m;

    # The public authority includes the published port, unlike the hostname.
    if ($http_host != "localhost:18443") { return 421; }
    if ($host != localhost) { return 421; }
    if ($ssl_server_name != localhost) { return 421; }
    # This origin server accepts origin-form targets, never proxy-form URLs.
    if ($request !~ "^[^ ]+ /") { return 400; }
    # Directory redirects must preserve the client's external port 18443.
    absolute_redirect off;

    location = /.well-known/oauth-authorization-server { rewrite ^ /index.php last; }
    location = /.well-known/oauth-protected-resource { rewrite ^ /index.php last; }
    location = /.well-known/oauth-protected-resource/mcp { rewrite ^ /index.php last; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/emailing-fpm/php.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/emailing/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
